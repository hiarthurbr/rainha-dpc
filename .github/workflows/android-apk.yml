name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # This project does not currently include gradlew/gradle-wrapper.jar.
      # Install the Gradle version specified in the project README instead.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [[ ( -f settings.gradle.kts || -f settings.gradle ) && -d app ]]; then
            project_dir="."
          elif [[ ( -f rainha-dpc/settings.gradle.kts || -f rainha-dpc/settings.gradle ) && -d rainha-dpc/app ]]; then
            project_dir="rainha-dpc"
          else
            echo "Could not find the Android project (expected settings.gradle[.kts] and app/)."
            exit 1
          fi

          echo "project_dir=${project_dir}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK for download
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/rainha-DPC-debug.apk
          ls -lh dist/rainha-DPC-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rainha-dpc-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/dist/rainha-DPC-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add download instructions to the run summary
        shell: bash
        run: |
          {
            echo "## APK build complete"
            echo
            echo "Download **rainha-DPC-debug.apk** from the **Artifacts** section at the bottom of this workflow run."
            echo
            echo "This is a debug APK intended for testing. Use a permanently signed release APK for deployment."
          } >> "$GITHUB_STEP_SUMMARY"
