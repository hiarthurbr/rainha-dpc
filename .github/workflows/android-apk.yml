name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # This project does not currently include gradlew/gradle-wrapper.jar.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [[ ( -f settings.gradle.kts || -f settings.gradle ) && -d app ]]; then
            project_dir="."
          elif [[ ( -f rainha-dpc/settings.gradle.kts || -f rainha-dpc/settings.gradle ) && -d rainha-dpc/app ]]; then
            project_dir="rainha-dpc"
          else
            echo "Could not find the Android project (expected settings.gradle[.kts] and app/)."
            exit 1
          fi

          echo "project_dir=${project_dir}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Sign release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets."
            exit 1
          fi

          keystore="$RUNNER_TEMP/rainha-release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK and calculate provisioning checksum
        id: certificate
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cert_info="$("$apksigner" verify --print-certs dist/app-release.apk)"
          printf '%s\n' "$cert_info"

          digest_hex="$(sed -nE 's/^Signer #1 certificate SHA-256 digest: ([[:xdigit:]]+)$/\1/p' <<< "$cert_info")"
          if [[ -z "$digest_hex" ]]; then
            echo "::error::Could not read the APK signer SHA-256 certificate digest."
            exit 1
          fi

          digest="$(python3 -c 'import base64, sys; print(base64.urlsafe_b64encode(bytes.fromhex(sys.argv[1])).decode().rstrip("="))' "$digest_hex")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Release APK ready"
            echo
            echo "- APK: \`app-release.apk\`"
            echo "- Android provisioning certificate SHA-256 checksum (URL-safe Base64): \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATE_DIGEST: ${{ steps.certificate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_title="Rainha DPC build ${GITHUB_RUN_NUMBER}"
          printf -v release_notes '## Rainha DPC release APK\n\nAndroid provisioning certificate SHA-256 checksum (URL-safe Base64):\n\n`%s`\n\nBuilt from commit `%s` by workflow run %s.\n' \
            "$CERTIFICATE_DIGEST" "$GITHUB_SHA" "$GITHUB_RUN_ID"

          gh release create "$release_tag" dist/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes "$release_notes"